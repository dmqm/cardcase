<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0D">
  <title>卡柜 Cardcase</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <header class="site-header">
    <h1 class="brand">卡柜 Cardcase</h1>
    <dl class="stats">
      <div><dt>总数</dt><dd id="stat-total">0</dd></div>
      <div><dt>系列</dt><dd id="stat-series">0</dd></div>
      <div><dt>隐藏</dt><dd id="stat-secret">0</dd></div>
    </dl>
    <nav class="tabs">
      <a href="#/gallery">展馆</a>
      <a href="#/data">数据</a>
    </nav>
  </header>

  <main>
    <section id="view-gallery">
      <div id="empty-state" class="empty">第一张卡，等你放进来</div>
      <div id="grid" class="case"></div>
    </section>
    <section id="view-data" hidden>
      <p class="placeholder">数据视图即将到来</p>
    </section>
    <section id="view-detail" hidden></section>
  </main>

  <button id="fab-import" class="fab" type="button">+ 入柜</button>

  <footer class="site-footer">非官方粉丝项目，与泡泡玛特无关</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
